<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Js</title>

    <script>
        console.log("Internal JavaScript");
        console.log("Performing Mathematical Operation\n");

        let a=10;
        let b=60;
        
        console.log(`Addition of ${a} and ${b} is ${(a+b)}`);

        console.log(`Subtraction of ${a} and ${b} is ${(a-b)}`);

        console.log(`Multiplication of ${a} and ${b} is ${(a*b)}`);

        console.log(`Divsion of ${b} and ${a} is ${(b/a)}`);

        console.log(`Square of ${a} is ${(a*a)}`);
        
        console.log(`Cube of ${b} is ${b*b*b}`);
        
        
        
        
    </script>

</head>

<body>
    <h1>Internal JavaScript</h1>
</body>
</html>
